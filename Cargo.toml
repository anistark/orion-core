[package]
name = "orion-core"
version = "0.9.0"
description = "Backend-agnostic agent harness for local LLM inference"
authors = ["Kumar Anirudha <anirudhastark@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.85"
# Resolve dependencies to versions that still build on `rust-version`, so a
# dependency raising its own floor cannot silently raise ours (resolver 3,
# stable since Cargo 1.84).
resolver = "3"
repository = "https://github.com/anistark/orion-core"
homepage = "https://github.com/anistark/orion-core"
documentation = "https://docs.rs/orion-core"
readme = "README.md"
keywords = ["llm", "agent", "inference", "local-llm", "ai"]
categories = ["asynchronous", "text-processing"]

[features]
default = ["tools", "chat-backend"]
# The `Tool` trait + the agent's tool-execution loop. Disable
# (`--no-default-features`) to drop the `async-trait` dependency for minimal
# consumers that only need plain chat. Also enables tokio's `macros`, which
# `ToolContext::run_child` uses to stream a child agent's events live.
# Tool-call *parsing* (`parse_tool_calls`, `ParsedToolCall`, `ToolSchema`)
# stays available either way.
tools = ["dep:async-trait", "tokio/macros"]
# The `ChatBackend` trait: a backend taking structured messages rather than a
# formatted prompt, which is what hosted chat APIs want. Async, so it needs
# `async-trait` for dyn-compatibility. Disable for a prompt-only consumer.
chat-backend = ["dep:async-trait"]
# A supported, streaming OpenAI-compatible HTTP backend
# (`backends::OpenAiHttpBackend`). Pulls in a blocking HTTP client; off by
# default so the core crate stays dependency-light.
http-backend = ["dep:reqwest", "reqwest/blocking"]
# Agent Skills (`skills::Skill`, `SkillSet`): load `SKILL.md` folders and, with
# `tools`, offer them to the model through a `load_skill` tool. Adds a YAML
# parser for the frontmatter.
skills = ["dep:serde_norway"]
# Plugin marketplaces (`plugins`): fetch a Claude Code marketplace catalog,
# install plugins from git into a store directory, and read the MCP servers and
# skills they ship. Implies `skills`; adds an async HTTP client and runs `git`.
plugins = ["skills", "dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
log = "0.4"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = [
    "json",
    "rustls",
] }
serde_norway = { version = "0.9", optional = true }

[dev-dependencies]
# Enables `#[tokio::main]` and a multi-thread runtime for examples/tests.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Lets integration tests implement the async `Tool` trait.
async-trait = "0.1"
# Property tests for pruning invariants.
proptest = "1"
# Scratch directories for the skills and plugin-store tests.
tempfile = "3"
# Benchmarks for the context pipeline.
criterion = "0.7"

# Thin demo driving the supported `backends::OpenAiHttpBackend`. Build/run with:
#   cargo run --example openai_backend --features http-backend
[[example]]
name = "openai_backend"
required-features = ["http-backend"]

[[bench]]
name = "context_bench"
harness = false
